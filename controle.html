<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        :root{
            --corFundo: rgb(230, 240, 235);
        }

        *{
            margin: 0px;
            padding: 0px;
        }

        body{
            -webkit-user-select: text !important;
            user-select: text !important;
            overflow: hidden;
        }


        /* -------- ESTRUTURA*/

        #header{
            position: relative;
            width: 100%;
            min-height: 50px;
            background-color: rgb(145, 173, 148);
            box-shadow: 0 8px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
        }

        #body{
            padding: 25px;
            padding-top: 15px;
            margin: auto;
            top: 0;
            left: 0;
            overflow: auto;
            height: calc(100vh - 65px);
        }

        #botoes_menu{
            display: flex;
            align-items: end;
        }

        #botoes_acao, #botoes_controle{
            display: flex;
            align-items: center;
        }


        /* -------- PLATAFORMAS*/

        .plataforma{
            margin-top: 15px;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 6px;
            border-top: 1px rgba(164, 164, 164, 0.816) solid;
            border-left: 1px rgba(164, 164, 164, 0.816) solid;
            border-right: 1px rgba(164, 164, 164, 0.816) solid;
        }

        .plataforma_header{
            background-color: rgb(145, 173, 148);
            border-bottom: 1px rgba(164, 164, 164, 0.816) solid;
            min-height: 25px;
            padding: 2px;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: center;
        }

        .plataforma_pages{
            display: none;
            margin: auto;
            background-color: rgb(240, 245, 240);
        }

        .plataforma_pages.open{
            display: block;
        }

        .item_plataforma_page{
            border-bottom: 2px rgba(164, 164, 164, 0.816) solid;
            padding: 3px;
            display: flex;
            flex-wrap: wrap;
        }

        .item_plataforma_page > *{
            height: 100%;
            flex: 1 1 auto;
            min-width: 0;
            margin: 2px;
        }

        .id_page{
            min-width: 10%;
        }

        .url_page{
            min-width: 58%;
        }

        .instrucao_page{
            min-width: 30%;
        }

        .id_page_editar{
            max-width: 10%;
        }

        .instrucao_page_editar{
            display: inline-flex;
            margin-left: 10px;
            max-width: 45px;
        }

        .inpu_ativar{
            margin-right: 10px;
        }

        .botaoMenu{
            margin-right: 10px;
            border-top-right-radius: 5px;
            border-top-left-radius: 5px;
        }

        .botaoMenu.ativo{
            background-color: rgb(80, 139, 68);
        }

        .botaoMenu:hover{
            background-color: rgb(112, 164, 102);
        }

        .botaoAcao{
            width: max-content;
            height: 20px;
            padding: 5px;
            margin: 5px;
        }


        /* -------- INSTRUCOES*/

        #main_editor_instrucao{
            height: max-content;
            overflow-y: auto;
        }

        #botaoSalvar{
            background-color: rgb(47, 215, 47);
            border: solid 2px green;
        }

        #botaoCancelar{
            background-color: rgb(220, 54, 54);
            border: solid 2px rgb(158, 30, 30);
        }

        #botaoTestar{
            background-color: rgb(54, 143, 220);
            border: solid 2px rgb(42, 110, 169);
        }

        #botaoPararTeste{
            
        }

        .input_texto{
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            padding: 10px;
            display: block;
            width: max-content;
            overflow: hidden;
            min-height: 20px;
            line-height: 20px;
            border: 2px solid #ccc;
            white-space: nowrap;
        }

        #area_retorno_crawler{
            min-width: 100px;
            min-height: 100px;
        }


        /* -------- MODAIS*/

        .container_modal_editar{
            position: fixed;
            width: 100vw;
            height: 100vh;
            background-color: rgba(148, 148, 148, 0.7);
            display: none;
            top: 0;
            left: 0;
        }

        .modal_editar{
            width: 60%;
            position: relative;
            top: 30px;
            margin: auto;
            left: 0;
            right: 0;
        }


        /* -------- USUARIOS*/


        /* -------- OUTROS*/

        input{
            accent-color: green;
        }
        
        .svg-sm{ width: 30px; height: 30px; }
        .svg-sm2{ width: 25px; height: 25px; }
        .svg-smm{ width: 20px; height: 20px; }

    </style>

</head>

        function abrirEditorInstrucoes(nome_plataforma, id_platafroma, id_plataforma_page){
            for (const [url, url_valor] of Object.entries(plataformas[id_platafroma]['urls'])){
                if (id_plataforma_page == url_valor['id_plataforma_page']){

                    var area_editar_instrucao = document.getElementById("area_editar_instrucao");

                    identificacao_instrucao = id_platafroma + " > " + nome_plataforma + " > " + url;
                    if (identificacao_instrucao in instrucoes_em_edicao){
                        area_editar_instrucao.value = instrucoes_em_edicao[identificacao_instrucao];
                    }else{
                        insstring = url_valor['instrucao'].replaceAll("\t", "&emsp;").replaceAll(" ", "&nbsp;");

                        var mar = '\n';
                        if (insstring.includes('\\n')){
                            mar = '\\n';
                        }
                        insstring = insstring.split(mar)
                        for (var l=0; l< insstring.length; l++){
                            if (insstring[l].trim() == ""){
                                insstring[l] = '<br>'
                            }
                            insstring[l] = '<div>' + insstring[l] + '</div>';
                        }

                        insstring = insstring.join("")

                        instrucoes_em_edicao[identificacao_instrucao] = insstring;

                        input_pesquisa_instrucoes = document.getElementById("input_pesquisa_instrucoes");
                        input_pesquisa_instrucoes.insertAdjacentHTML("beforeend", `<option value='${identificacao_instrucao}'>${identificacao_instrucao}</option>`);
                        input_pesquisa_instrucoes.value = identificacao_instrucao;

                        area_editar_instrucao.innerHTML = insstring;
                    }

                    alterarFuncao("main_editor_instrucao");
                    break;
                }
            }
        }

        function retornarTextoInstrucao(){
            var area_editar_instrucao = document.getElementById("area_editar_instrucao");
            var linhas = area_editar_instrucao.children;

            var ins;

            for (var l=0; l < linhas.length; l++){
                if (linhas[l].innerText.trim() == ""){
                    if (l < linhas.length-1){
                        ins += '\n';
                    }
                }else{
                    if (l < linhas.length-1){
                        ins += linhas[l].innerText + '\n';
                    }else{
                        ins += linhas[l].innerText;
                    }
                }
            }

            if (ins == null){
                ins = "";
            }

            ins = ins.replaceAll('undefined', '');
            ins = ins.replaceAll(String.fromCharCode(160), ' ')
            return ins;
        }

        class Select{
            opcoesSelect = null;posSelecionado = -1;temEvento = false;corFundo = "rgb(200, 200, 200)";
            constructor(el, itens, inner='default', attrs={}){
                el.addEventListener("focus", () => {this.construirOpcoes(el, itens, inner, attrs, false, true);});
                el.addEventListener("focusout", () => {if(event.relatedTarget != null && event.relatedTarget.parentElement == this.opcoesSelect){this.atribuir(el, event.relatedTarget, inner, itens)}this.limpar();});
                el.addEventListener("keydown", () => {if (this.opcoesSelect != null){if (event.key == "ArrowDown" || event.key == "ArrowUp"){this.teclaMovimentar(event.key);}else if(event.key == "Enter" && this.posSelecionado != -1){this.atribuir(el, this.opcoesSelect.children[this.posSelecionado], inner, itens);this.limpar();}}});
                el.addEventListener("keyup", () => {if (event.key != "ArrowDown" && event.key != "ArrowUp" && event.key != "Enter" && event.key != "ArrowLeft" && event.key != "ArrowRight"){this.construirOpcoes(el, itens, inner, attrs, true, false);}});
            }
            limpar(){if (this.opcoesSelect != null){this.opcoesSelect.remove();this.opcoesSelect = null;this.posSelecionado=-1;this.temEvento = false;}}
            atribuir(el, item, inner, itens){el.value = item.innerText; el.closest(".id_page").innerHTML = Object.keys(itens.find(item => Object.values(item).includes(item.innerText)))[0];}
            construirOpcoes(el, itens, inner, attrs, limpar, todos=false){
                if (limpar && this.opcoesSelect != null){this.opcoesSelect.remove();this.opcoesSelect = null;}
                if (this.opcoesSelect == null){
                    var valoresSelect = [];
                    if (todos){valoresSelect = itens;
                    }else{var t = new RegExp(el.value.replace("?", ""), 'i');valoresSelect = itens.filter(x => t.test(x.url.replace("?", "")));}

                    if (valoresSelect.length > 0){
                        this.opcoesSelect = document.createElement("div");
                        this.opcoesSelect.setAttribute("style", `width:${window.getComputedStyle(el).getPropertyValue('width')}; left:${el.getBoundingClientRect().left+3}px; top: ${el.getBoundingClientRect().bottom}px; position: absolute; max-height: 200px; overflow: auto; background-color: ${this.corFundo};`);
                        var itemS = `<div onmouseover="this.style.backgroundColor='lightgray';" onmouseout="this.style.backgroundColor='white';" tabindex="0" style='user-select: none;'>`;
                        this.opcoesSelect.innerHTML = `${itemS} ${valoresSelect.map(item => item.url).join("</div>"+itemS)} </div></div>`;
                        document.body.insertAdjacentElement("afterend", this.opcoesSelect);
                    }
                }
            }
            teclaMovimentar(key){
                if (this.opcoesSelect.children.length > 0){
                    if (key == "ArrowDown"){this.posSelecionado ++;if (this.posSelecionado >= this.opcoesSelect.children.length){this.posSelecionado = 0;}
                    }else if (key == "ArrowUp"){event.preventDefault();this.posSelecionado --;if (this.posSelecionado < 0){this.posSelecionado = this.opcoesSelect.children.length - 1;}}
                    for (var [pos, child] of Object.entries(this.opcoesSelect.children)){if (pos == this.posSelecionado){child.style.backgroundColor = "grey";child.scrollIntoView({behavior: 'auto', block: 'center', inline: 'center'});}else{child.style.backgroundColor = this.corFundo;}}
                }
            }
        }
