<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            background-color: rgb(166, 199, 183);
        }

        #content, .linha{
            position: relative;
            margin: auto;
            left: 0;
            right: 0;
            width: max-content;
        }

        #selecionar_data{
            display: flex;
            flex-flow: row wrap;
            text-align: center;
            justify-content: space-between;
        }

        .bloqueado{
            pointer-events: none;
            user-select: none;
            opacity: 0.4;
        }

        h1{
            text-align: center;
        }

        .t_data{
            user-select: none;
        }

        #botao_gerar{
            width: 100%;
            background-color: rgb(93, 201, 93);
        }

        #plataforma{
            width: 100%;
        }

        #retorno{
            max-width: 250px;
            text-align: center;
        }

        #containerPlanilhaExistente{
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(128, 128, 128, 0.5);
            display: flex;
            flex-flow: row wrap;
            text-align: center;
            justify-content: center;
        }

        #modalPlanilhaExistente{
            width: 400px;
            height: 250px;
            background-color: rgb(209, 237, 223);
            margin-top: 100px;
            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            transition: 0.3s;
            overflow: hidden;
        }

        #modalPlanilhaExistente h1{
            font-size: 25px;
        }
        
        .botoes_escolha{
            display: flex;
            flex-flow: row wrap;
            text-align: center;
            justify-content: space-evenly;
        }

        #containerPlanilhaExistente.fechado{
            visibility: hidden;
        }

        #modalPlanilhaExistente.fechado{
            visibility: hidden;
            width: 0;
            height: 0;
        }

        #botaoSim{
            background-color: rgb(93, 201, 93);
            width: 100px;
            height: 30px;
        }

        #botaoNao{
            background-color: rgb(201, 107, 93);
            width: 100px;
            height: 30px;
        }

    </style>

</head>
<body>
    <div id="content">
        <h1>Gerar Planilha</h1>

        <div class="linha">
            <input class="t_data" type="radio" id="por_periodo" name="periodo" checked="" onclick="selecionarTipoData('periodo')">
            <label class="t_data" for="por_periodo" onclick="selecionarTipoData('periodo')">Por Período</label>
            <input class="t_data" type="radio" id="todos_registros" name="periodo" onclick="selecionarTipoData('tudo')">
            <label class="t_data" for="todos_registros" onclick="selecionarTipoData('tudo')">Todos os Registros</label>
        </div>
        <br>
        <div id="selecionar_data">
            <input type="date" id="data_inicial">
            <label id="ate">&nbsp;até&nbsp;</label>
            <input type="date" id="data_final">
        </div>
        <br>
        <label for="plataforma">Plataforma</label>
        <br>
        <select id="plataforma">
            <option value="pncp">PNCP SEGURO</option>
        </select>

        <br>
        <br>
        <br>
        <button id="botao_gerar" onclick="gerarPlanilha()">Gerar Planilha</button>
        <p id="retorno"></p>
    </div>

    <div id="containerPlanilhaExistente" class="fechado">
        <div id="modalPlanilhaExistente" class="fechado">
            <h1>Planilha com mesmo filtro já existente</h1>
            <br>
            <p>Você deseja sobreescrever a planilha?</p>
            <br><br>
            <div class="botoes_escolha">
                <button id="botaoNao" onclick="prosseguirGeracaoPlanilha(false)">Não</button>
                <button id="botaoSim" onclick="prosseguirGeracaoPlanilha(true)">Sim</button>
            </div>
        </div>
    </div>

    <script>
        function selecionarTipoData(tipo="periodo"){
            var data_inicial = document.getElementById("data_inicial");
            var data_final = document.getElementById("data_final");
            var ate = document.getElementById("ate");
            if (tipo == "periodo"){
                data_inicial.classList.remove("bloqueado");
                data_final.classList.remove("bloqueado");
                ate.classList.remove("bloqueado");
            }else{
                data_inicial.classList.add("bloqueado");
                data_final.classList.add("bloqueado");
                ate.classList.add("bloqueado");
            }
        }

        function gerarPlanilha(){
            var tipo_data = document.querySelector('input[name="periodo"]:checked').id;
            var data_inicial = document.getElementById("data_inicial").value;
            var data_final = document.getElementById("data_final").value;
            var plataforma = document.getElementById("plataforma").value;

            console.log(tipo_data, data_inicial, data_final, plataforma);
            document.getElementById("retorno").innerHTML = "<p style='color:blue;'>Gerando a Planilha...</p>"
            pywebview.api.gerarPlanilha(tipo_data, data_inicial, data_final, plataforma).then(function(response) {
                document.getElementById("retorno").innerHTML = response;
            });
        }

        function prosseguirGeracaoPlanilha(valor){
            fecharModal();
            if (valor === true){
                document.getElementById("retorno").innerHTML = "<p style='color:blue;'>Gerando a Planilha...</p>"
            }
            pywebview.api.prosseguirGeracaoPlanilha(valor).then(function(response) {
                document.getElementById("retorno").innerHTML = response;
            });
        }

        function abrirModal(){
            document.getElementById("containerPlanilhaExistente").classList.remove("fechado");
            document.getElementById("modalPlanilhaExistente").classList.remove("fechado");
        }

        function fecharModal(){
            document.getElementById("containerPlanilhaExistente").classList.add("fechado");
            document.getElementById("modalPlanilhaExistente").classList.add("fechado");
        }
    </script>

</body>
</html>
